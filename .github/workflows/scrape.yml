name: Scrape CMTEB

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # dispatch Nightly publish when the live state moves

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Scrape
        run: python3 scraper/scrape.py

      # Must run BEFORE the commit: it diffs the working tree against HEAD.
      # scrape.py is deliberately pure-stdlib so this 15-minute job installs
      # nothing. The detector reuses pipeline/parse.py, which needs lxml - and
      # without it the detector silently failed open on every run, publishing on
      # every commit. One wheel, ~seconds; version matches pyproject.
      - name: Install the parser's one dependency
        run: pip install --quiet --disable-pip-version-check 'lxml>=6.1.1'

      # continue-on-error is the structural guarantee behind the script's own
      # fail-open: even a hard crash here must never stop the commit below and
      # lose the scraped snapshot. Losing data is worse than a missed publish.
      - name: Did the live outage state change?
        id: live
        continue-on-error: true
        run: python3 scripts/live_changed.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # The site is static and was rebuilt only at 03:10, so a new outage - or a
      # revised restore estimate - could sit invisible for up to 24h. A visitor
      # reported exactly that on 2026-08-31. Publishing here closes that gap to
      # roughly the scrape interval.
      #
      # Gated on the live-state hash, not the raw bytes, so markup churn cannot
      # trigger a rebuild. Nightly publish keeps its own 03:10 schedule for the
      # historical rebuild; this only adds intraday publishes. Its `concurrency:
      # nightly` group serialises overlapping runs.
      - name: Publish now if the live state moved
        if: steps.commit.outputs.committed == 'true' && steps.live.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run nightly.yml -R ${{ github.repository }}
